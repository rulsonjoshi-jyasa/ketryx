<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ketryx Learning Project</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="card">
        <h1>Ketryx Learning Project</h1>
        <p class="subtitle">A simple task tracker to learn HTML, CSS, and JavaScript.</p>

        <form id="task-form">
          <input id="task-input" type="text" placeholder="Add a task" required />
          <button type="submit">Add</button>
        </form>

        <ul id="task-list"></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
